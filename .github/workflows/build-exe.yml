name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install root dependencies
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile

      - name: Install render-service dependencies
        shell: bash
        run: |
          cd render-service
          npm install
          cd ..

      - name: Build Next.js (standalone, with video export enabled)
        shell: bash
        env:
          NEXT_PUBLIC_ENABLE_VIDEO_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm build

      - name: Assemble Next.js standalone directory
        shell: bash
        run: |
          # 复制 static 资源到 standalone
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/

          # 复制 public 目录到 standalone
          mkdir -p .next/standalone/public
          cp -r public/* .next/standalone/public/ 2>/dev/null || true

          echo "=== standalone directory ==="
          ls -la .next/standalone/
          echo "=== standalone size ==="
          du -sh .next/standalone/

      - name: Build render-service
        shell: bash
        run: |
          cd render-service
          npx tsc --outDir dist
          echo "=== render-service dist ==="
          ls -la dist/
          cd ..

      - name: Build Electron main process
        shell: bash
        run: |
          npx tsc -p electron/tsconfig.json
          echo "=== electron dist ==="
          ls -la dist-electron/

      - name: Download Chromium headless shell
        shell: bash
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/chromium-cache
        run: |
          npx puppeteer browsers install chrome-headless-shell

      - name: Locate and stage Chromium
        id: chromium
        shell: bash
        run: |
          CHROMIUM_EXE=$(find "${{ github.workspace }}/chromium-cache" -name "chrome-headless-shell.exe" 2>/dev/null | head -1)
          if [ -z "$CHROMIUM_EXE" ]; then
            echo "chrome-headless-shell.exe not found!"
            find "${{ github.workspace }}/chromium-cache" -type f 2>/dev/null | head -30
            exit 1
          fi
          CHROMIUM_DIR=$(dirname "$CHROMIUM_EXE")
          echo "Chromium found at: $CHROMIUM_EXE"
          echo "Chromium dir: $CHROMIUM_DIR"

          # 复制整个 Chromium 目录到打包目录
          mkdir -p chromium
          cp -r "$CHROMIUM_DIR"/* chromium/
          echo "=== chromium dir ==="
          ls -la chromium/
          echo "chromium_path=chromium/chrome-headless-shell.exe" >> $GITHUB_OUTPUT

      - name: Stage FFmpeg binary
        shell: bash
        run: |
          # 直接下载 ffmpeg 静态二进制，不依赖 ffmpeg-static 包
          mkdir -p ffmpeg
          echo "Downloading FFmpeg..."
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          echo "Extracting FFmpeg..."
          unzip -j ffmpeg.zip "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -d ffmpeg/
          rm -f ffmpeg.zip
          ls -la ffmpeg/
          ./ffmpeg/ffmpeg.exe -version | head -1

      - name: Build Electron app (electron-builder)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
          # 禁止 CI 自动发布
          GH_TOKEN: ""
        run: |
          npx electron-builder --win --x64 --config electron-builder.yml --publish never

      - name: Verify build output completeness
        shell: bash
        run: |
          echo "=== Verifying Electron runtime files ==="
          UNPACKED_DIR=$(find release -type d -name "win-unpacked" | head -1)
          echo "Unpacked dir: $UNPACKED_DIR"
          
          if [ -z "$UNPACKED_DIR" ]; then
            echo "ERROR: win-unpacked directory not found!"
            find release -type d 2>/dev/null
            exit 1
          fi
          
          echo ""
          echo "=== Root directory files ==="
          ls -la "$UNPACKED_DIR/"
          
          echo ""
          echo "=== Checking critical Electron runtime files ==="
          MISSING=0
          for f in icudtl.dat v8_context_snapshot.bin resources.pak ffmpeg.dll libEGL.dll libGLESv2.dll; do
            if [ -f "$UNPACKED_DIR/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
              MISSING=1
            fi
          done
          
          echo ""
          echo "=== Checking resources directory ==="
          ls -la "$UNPACKED_DIR/resources/"
          
          echo ""
          echo "=== Checking app.asar (electron main process) ==="
          if [ -f "$UNPACKED_DIR/resources/app.asar" ]; then
            echo "  [OK] app.asar exists ($(du -sh "$UNPACKED_DIR/resources/app.asar" | cut -f1))"
          else
            echo "  [MISSING] app.asar"
            MISSING=1
          fi
          
          echo ""
          echo "=== Checking openmaic resources (Next.js + render-service) ==="
          if [ -d "$UNPACKED_DIR/resources/openmaic/.next/standalone" ]; then
            echo "  [OK] .next/standalone exists"
            ls "$UNPACKED_DIR/resources/openmaic/.next/standalone/" | head -10
          else
            echo "  [MISSING] .next/standalone"
            MISSING=1
          fi
          
          if [ -d "$UNPACKED_DIR/resources/openmaic/render-service/dist" ]; then
            echo "  [OK] render-service/dist exists"
            ls "$UNPACKED_DIR/resources/openmaic/render-service/dist/" | head -10
          else
            echo "  [MISSING] render-service/dist"
            MISSING=1
          fi
          
          echo ""
          if [ $MISSING -eq 1 ]; then
            echo "ERROR: Critical files missing! Build verification failed."
            exit 1
          else
            echo "All critical files verified successfully."
          fi

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Release directory ==="
          find release -type f 2>/dev/null || echo "No release files found"
          echo ""
          echo "=== File sizes ==="
          du -sh release/*/*.exe 2>/dev/null || du -sh release/*/*/*.exe 2>/dev/null || true

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenMAIC-Windows-EXE
          path: |
            release/**/*.exe
          retention-days: 30
